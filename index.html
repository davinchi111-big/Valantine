<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="hearts-background"></div>
        
        <div class="card">
            <div class="header">
                <h1>💕 A Special Question 💕</h1>
            </div>
            
            <div class="content">
                <p class="intro">Hey there...</p>
                <p class="message">Every moment with you makes my heart skip a beat. Your smile brightens my day, and I can't imagine my life without you.</p>
                
                <div class="question">
                    <h2>Will you be my Valentine?</h2>
                </div>
                
                <div class="buttons">
                    <button class="yes-btn" onclick="handleYes()">Yes! 💞</button>
                    <button class="no-btn" id="noBtn" onclick="handleNo()">No</button>
                </div>
                
                <p id="response" class="response-message"></p>
            </div>
            
            <div class="footer">
                <p>✨ Made with love just for you ✨</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
